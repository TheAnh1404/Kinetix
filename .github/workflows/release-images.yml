name: Publish versioned container images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify release before publishing
        run: |
          docker compose build
          docker compose up -d --no-build --wait --wait-timeout 180
          curl --fail http://localhost:4000/api/health
          curl --fail http://localhost:3000/login
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit tags
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REPO=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker tag kinetix-backend:local "ghcr.io/$REPO-backend:sha-$COMMIT_SHA"
          docker tag kinetix-frontend:local "ghcr.io/$REPO-frontend:sha-$COMMIT_SHA"
          docker push "ghcr.io/$REPO-backend:sha-$COMMIT_SHA"
          docker push "ghcr.io/$REPO-frontend:sha-$COMMIT_SHA"
      - if: always()
        run: docker compose down -v --remove-orphans
