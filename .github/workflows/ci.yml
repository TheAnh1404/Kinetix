name: Kinetix CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: "24"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Smart Contracts Compilation, Linting & Hardhat Test Suite
  # ----------------------------------------------------------------------------
  contracts-test:
    name: Contracts & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install All Monorepo Dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Compile Solidity Contracts
        run: npm run compile

      - name: Lint Solidity Code
        run: npm run sol:lint

      - name: Run Hardhat Test Suite (196+ tests)
        run: npx hardhat test
        env:
          NODE_ENV: test

  # ----------------------------------------------------------------------------
  # 2. Backend TypeScript Typecheck & Validation
  # ----------------------------------------------------------------------------
  backend-check:
    name: Backend API & Worker Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Monorepo & Backend Dependencies
        run: |
          npm ci
          npm --prefix backend ci

      - name: Typecheck Backend Code
        working-directory: backend
        run: npm run typecheck

  # ----------------------------------------------------------------------------
  # 3. Frontend TypeScript Typecheck & Next.js Production Build
  # ----------------------------------------------------------------------------
  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Monorepo & Frontend Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Typecheck Frontend Code
        working-directory: frontend
        run: npm run typecheck

      - name: Build Next.js Production App
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          KINETIX_CONSTRAINED_BUILD: "true"

  # ----------------------------------------------------------------------------
  # 4. Docker Images Build Verification
  # ----------------------------------------------------------------------------
  docker-build-verification:
    name: Docker Images Build Check
    needs: [contracts-test, backend-check, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: kinetix-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: kinetix-frontend:ci-test
