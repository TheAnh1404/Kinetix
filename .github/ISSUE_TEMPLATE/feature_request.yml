name: Feature request
description: Propose a product or developer improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected users
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Alternatives, custody implications, and risks
